<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>13개월 캘린더</title>
<style>
  :root{
    --bg:#ffffff; --fg:#1a1a1a; --sub:#666; --line:#ddd; --accent:#2b6cb0;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#111318; --fg:#eee; --sub:#aaa; --line:#333; --accent:#63b3ed;
    }
  }
  :root[data-theme="dark"]{
    --bg:#111318; --fg:#eee; --sub:#aaa; --line:#333; --accent:#63b3ed;
  }
  html{
    font-size:26px;
  }
  @media (min-width:700px){
    html{ font-size:30px; }
  }
  body{
    background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    margin:0 auto; padding:20px 14px; max-width:480px;
  }
  .yearRow input{
    width:100%; box-sizing:border-box; padding:12px; font-size:1.1rem;
    border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--fg);
  }
  .navBtn{
    flex:0 0 auto; width:46px; height:46px; border-radius:8px;
    border:1px solid var(--line); background:var(--bg); color:var(--fg);
    font-size:1.3rem; cursor:pointer;
  }
  select{
    flex:1; padding:12px; font-size:1.1rem;
    border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--fg);
  }
  h1{font-size:1.3rem; text-align:center; margin:0 0 18px 0; color:var(--accent);}
  th,td{ text-align:center; padding:12px 0; font-size:1.15rem; }
  .g{ display:block; font-size:0.72rem; color:var(--sub); margin-top:4px; }
  @media (min-width:700px){
    body{
      max-width:720px; padding:40px 24px;
    }
    h1{ font-size:1.8rem !important; margin-bottom:24px !important; }
    .yearRow input, select{ font-size:1.3rem; padding:14px; }
    .navBtn{ width:56px; height:56px; font-size:1.5rem; }
    th,td{ font-size:1.4rem; padding:18px 0; }
    .g{ font-size:0.9rem; }
    .specialGrid .day{ width:220px; padding:24px 16px; }
    .specialGrid .wd, .specialGrid .nameLabel{ font-size:1.3rem; }
    .specialGrid .dateLabel{ font-size:1rem; }
  }
  .yearRow{
    margin-bottom:12px;
  }
  .monthRow{
    display:flex; gap:8px; justify-content:center; align-items:center; margin-bottom:14px;
  }
  .monthRow select{
    flex:0 1 160px;
  }
  table{
    width:100%; border-collapse:collapse; table-layout:fixed;
  }
  th{ color:var(--sub); font-weight:500; }
  td.day{ border-radius:8px; vertical-align:top; padding-top:8px; padding-bottom:6px; }
  td.today{ background:var(--accent); color:#fff; font-weight:700; }
  td.today .g{ color:#fff; opacity:0.85; }
  .specialGrid{
    display:flex; flex-direction:row; gap:14px; justify-content:center; margin-top:8px;
  }
  .specialGrid .day{
    width:120px; height:auto; padding:14px 8px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    border-radius:8px;
  }
  .specialGrid .wd{
    font-size:0.9rem; color:var(--sub); font-weight:500;
  }
  .specialGrid .nameLabel{
    font-size:0.9rem; font-weight:400;
  }
  .specialGrid .dateLabel{
    font-size:0.62rem; color:var(--sub);
  }
  .specialGrid .day.today{
    background:var(--accent); color:#fff;
  }
  .specialGrid .today .wd,
  .specialGrid .today .dateLabel{
    color:#fff; opacity:0.9;
  }
</style>
</head>
<body>

<div class="yearRow">
  <input type="number" id="yearSel" step="1">
</div>
<div class="monthRow">
  <button class="navBtn" id="prevBtn">‹</button>
  <select id="monthSel">
    <option value="1">1월</option><option value="2">2월</option><option value="3">3월</option>
    <option value="4">4월</option><option value="5">5월</option><option value="6">6월</option>
    <option value="7">7월</option><option value="8">8월</option><option value="9">9월</option>
    <option value="10">10월</option><option value="11">11월</option><option value="12">12월</option>
    <option value="13">13월</option>
    <option value="special">덧날</option>
  </select>
  <button class="navBtn" id="nextBtn">›</button>
</div>

<h1 id="title"></h1>
<table id="grid"></table>
<div class="specialGrid" id="specialGrid" style="display:none;"></div>

<script>
const weekdayNames = ["월","화","수","목","금","토","일"];
const monthNames = ["1월","2월","3월","4월","5월","6월","7월","8월","9월","10월","11월","12월","13월"];

const yearSel = document.getElementById('yearSel');
const monthSel = document.getElementById('monthSel');
const thisYear = new Date().getFullYear();
yearSel.value = thisYear;

function isLeap(y){
  return (y % 4 === 0 && y % 100 !== 0) || (y % 400 === 0);
}

const gregWeekdayNames = ["일","월","화","수","목","금","토"]; // getDay() 0=일 기준

function fmt(d){
  return (d.getMonth()+1) + "/" + d.getDate() + "(" + gregWeekdayNames[d.getDay()] + ")";
}

// index 0~12 = 1월~13월, index 13 = special
function render(){
  const y = parseInt(yearSel.value);
  if(!y || isNaN(y)) return;
  const idx = monthSel.value === 'special' ? 13 : parseInt(monthSel.value) - 1;
  const base = new Date(y,0,1);
  const todayReal = new Date(); todayReal.setHours(0,0,0,0);

  const gridTable = document.getElementById('grid');
  const specialGrid = document.getElementById('specialGrid');
  const title = document.getElementById('title');

  if(idx === 13){
    gridTable.style.display = 'none';
    specialGrid.style.display = 'flex';
    specialGrid.innerHTML = '';
    title.textContent = y + "년 — 덧날";

    const yearDay = new Date(base); yearDay.setDate(yearDay.getDate() + 364);
    const div1 = document.createElement('div');
    div1.className = 'day';
    div1.innerHTML = '<span class="wd">무요일</span><span class="nameLabel">연외일</span><span class="dateLabel">' + fmt(yearDay) + '</span>';
    if(sameDay(yearDay, todayReal)) div1.classList.add('today');
    specialGrid.appendChild(div1);

    if(isLeap(y)){
      const leapDay = new Date(base); leapDay.setDate(leapDay.getDate() + 365);
      const div2 = document.createElement('div');
      div2.className = 'day';
      div2.innerHTML = '<span class="wd">무요일</span><span class="nameLabel">윤일</span><span class="dateLabel">' + fmt(leapDay) + '</span>';
      if(sameDay(leapDay, todayReal)) div2.classList.add('today');
      specialGrid.appendChild(div2);
    }
    return;
  }

  specialGrid.style.display = 'none';
  gridTable.style.display = '';
  title.textContent = y + "년 " + monthNames[idx];

  gridTable.innerHTML = '';
  const thead = document.createElement('tr');
  weekdayNames.forEach(d=>{
    const th = document.createElement('th'); th.textContent = d; thead.appendChild(th);
  });
  gridTable.appendChild(thead);

  let dayNum = 1;
  for(let week=0; week<4; week++){
    const tr = document.createElement('tr');
    for(let d=0; d<7; d++){
      const td = document.createElement('td');
      td.className = 'day';
      const overallIndex = idx*28 + dayNum;
      const g = new Date(base);
      g.setDate(g.getDate() + (overallIndex - 1));
      td.innerHTML = dayNum + '<span class="g">' + fmt(g) + '</span>';
      if(sameDay(g, todayReal)) td.classList.add('today');
      tr.appendChild(td);
      dayNum++;
    }
    gridTable.appendChild(tr);
  }
}

function sameDay(a,b){
  return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
}

function step(delta){
  let y = parseInt(yearSel.value);
  let idx = monthSel.value === 'special' ? 13 : parseInt(monthSel.value) - 1;
  idx += delta;
  if(idx > 13){ idx = 0; y += 1; }
  if(idx < 0){ idx = 13; y -= 1; }
  yearSel.value = y;
  monthSel.value = idx === 13 ? 'special' : String(idx + 1);
  render();
}

document.getElementById('prevBtn').addEventListener('click', ()=>step(-1));
document.getElementById('nextBtn').addEventListener('click', ()=>step(1));
yearSel.addEventListener('input', render);
monthSel.addEventListener('change', render);
render();

</script>
</body>
</html>
