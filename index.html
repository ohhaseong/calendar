<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📅</text></svg>">
<title>13개월 캘린더</title>
<style>
  :root{
    --bg:#ffffff; --fg:#1a1a1a; --sub:#666; --line:#ddd; --accent:#2b6cb0;

    /* 스페이싱 스케일: 4px 기준, 8px 그리드 */
    --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px;

    /* 타입 스케일: 1rem 기준 1.25배(Major Third) */
    --fs-xs:0.64rem;   /* 보조 텍스트(양력 날짜) */
    --fs-base:1rem;    /* 본문(요일 헤더, 날짜 숫자) */
    --fs-md:1.25rem;   /* 강조(화살표 버튼) */
    --fs-lg:1.563rem;  /* 제목 */

    --radius:8px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#111318; --fg:#eee; --sub:#aaa; --line:#333; --accent:#63b3ed;
    }
  }
  :root[data-theme="dark"]{
    --bg:#111318; --fg:#eee; --sub:#aaa; --line:#333; --accent:#63b3ed;
  }
  *{
    -webkit-text-size-adjust:100%;
    text-size-adjust:100%;
    box-sizing:border-box;
  }
  html{
    font-size:clamp(16px, 4.5vw, 20px);
  }
  @media (min-width:700px){
    html{ font-size:clamp(18px, 2vw, 24px); }
  }
  body{
    background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:var(--fs-base);
    margin:0 auto; max-width:480px;
    padding:calc(var(--sp-5) + env(safe-area-inset-top)) calc(var(--sp-4) + env(safe-area-inset-right))
            calc(var(--sp-5) + env(safe-area-inset-bottom)) calc(var(--sp-4) + env(safe-area-inset-left));
  }
  @media (min-width:700px){
    body{ max-width:720px; padding:var(--sp-6); }
    .specialGrid .day{ width:220px; }
  }

  input, select{
    font-size:var(--fs-base); padding:var(--sp-3);
    border:1px solid var(--line); border-radius:var(--radius);
    background:var(--bg); color:var(--fg);
    -webkit-appearance:none; appearance:none;
  }
  .yearRow{ margin-bottom:var(--sp-3); }
  .yearRow input{ width:100%; }
  input[type="number"]::-webkit-inner-spin-button,
  input[type="number"]::-webkit-outer-spin-button{ opacity:1; }

  .monthRow{
    display:flex; gap:var(--sp-2); justify-content:center; align-items:center;
    margin-bottom:var(--sp-4);
  }
  .monthRow select{ flex:0 1 160px; }
  .navBtn{
    flex:0 0 auto; width:44px; height:44px; border-radius:var(--radius);
    border:1px solid var(--line); background:var(--bg); color:var(--fg);
    font-size:var(--fs-md); cursor:pointer;
  }

  h1{
    font-size:var(--fs-lg); text-align:center; margin:0 0 var(--sp-5) 0; color:var(--accent);
  }

  table{ width:100%; border-collapse:collapse; table-layout:fixed; }
  th,td{ text-align:center; padding:var(--sp-3) 0; font-size:var(--fs-base); }
  th{ color:var(--sub); font-weight:500; }
  td.day{ border-radius:var(--radius); vertical-align:top; }
  td.today{ background:var(--accent); color:#fff; font-weight:700; }
  .g{ display:block; font-size:var(--fs-xs); color:var(--sub); margin-top:var(--sp-1); }
  td.today .g{ color:#fff; opacity:0.85; }

  .specialGrid{
    display:flex; flex-direction:row; gap:var(--sp-4); justify-content:center; margin-top:var(--sp-2);
  }
  .specialGrid .day{
    width:120px; height:auto; padding:var(--sp-5) var(--sp-3);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    border-radius:var(--radius);
  }
  .specialGrid .wd{
    font-size:var(--fs-base); color:var(--sub); font-weight:500; margin-bottom:var(--sp-5);
  }
  .specialGrid .nameLabel{ font-size:var(--fs-base); font-weight:400; }
  .specialGrid .dateLabel{ font-size:var(--fs-xs); color:var(--sub); margin-top:var(--sp-1); }
  .specialGrid .day.today{ background:var(--accent); color:#fff; }
  .specialGrid .today .wd,
  .specialGrid .today .dateLabel{ color:#fff; opacity:0.9; }
</style>
</head>
<body>

<div class="yearRow">
  <input type="number" id="yearSel" step="1" aria-label="연도">
</div>
<div class="monthRow">
  <button class="navBtn" id="prevBtn" aria-label="이전 달">‹</button>
  <select id="monthSel" aria-label="월 선택">
    <option value="1">1월</option><option value="2">2월</option><option value="3">3월</option>
    <option value="4">4월</option><option value="5">5월</option><option value="6">6월</option>
    <option value="7">7월</option><option value="8">8월</option><option value="9">9월</option>
    <option value="10">10월</option><option value="11">11월</option><option value="12">12월</option>
    <option value="13">13월</option>
    <option value="special">덧날</option>
  </select>
  <button class="navBtn" id="nextBtn" aria-label="다음 달">›</button>
</div>

<h1 id="title"></h1>
<table id="grid"></table>
<div class="specialGrid" id="specialGrid" style="display:none;"></div>

<script>
const weekdayNames = ["월","화","수","목","금","토","일"];
const monthNames = ["1월","2월","3월","4월","5월","6월","7월","8월","9월","10월","11월","12월","13월"];

const yearSel = document.getElementById('yearSel');
const monthSel = document.getElementById('monthSel');
const gridTable = document.getElementById('grid');
const specialGrid = document.getElementById('specialGrid');
const title = document.getElementById('title');
const thisYear = new Date().getFullYear();
yearSel.value = thisYear;

// 오늘 날짜에 해당하는 13개월력 달을 기본 선택
(function setDefaultMonth(){
  const base0 = new Date(thisYear,0,1);
  const today0 = new Date(); today0.setHours(0,0,0,0);
  const doy = Math.round((today0 - base0) / 86400000) + 1;
  if(doy > 364){
    monthSel.value = 'special';
  } else {
    const idx0 = Math.floor((doy - 1) / 28); // 0~12
    monthSel.value = String(idx0 + 1);
  }
})();

function isLeap(y){
  return (y % 4 === 0 && y % 100 !== 0) || (y % 400 === 0);
}

const gregWeekdayNames = ["일","월","화","수","목","금","토"]; // getDay() 0=일 기준

function fmt(d){
  return (d.getMonth()+1) + "/" + d.getDate() + "(" + gregWeekdayNames[d.getDay()] + ")";
}

// index 0~12 = 1월~13월, index 13 = special
function render(){
  const y = parseInt(yearSel.value);
  if(isNaN(y)) return;
  const idx = monthSel.value === 'special' ? 13 : parseInt(monthSel.value) - 1;
  const base = new Date(y,0,1);
  const todayReal = new Date(); todayReal.setHours(0,0,0,0);

  if(idx === 13){
    gridTable.style.display = 'none';
    specialGrid.style.display = 'flex';
    specialGrid.innerHTML = '';
    title.textContent = y + "년 덧날";

    const yearDay = new Date(base); yearDay.setDate(yearDay.getDate() + 364);
    const div1 = document.createElement('div');
    div1.className = 'day';
    div1.innerHTML = '<span class="wd">무요일</span><span class="nameLabel">연외일</span><span class="dateLabel">' + fmt(yearDay) + '</span>';
    if(sameDay(yearDay, todayReal)) div1.classList.add('today');
    specialGrid.appendChild(div1);

    if(isLeap(y)){
      const leapDay = new Date(base); leapDay.setDate(leapDay.getDate() + 365);
      const div2 = document.createElement('div');
      div2.className = 'day';
      div2.innerHTML = '<span class="wd">무요일</span><span class="nameLabel">윤일</span><span class="dateLabel">' + fmt(leapDay) + '</span>';
      if(sameDay(leapDay, todayReal)) div2.classList.add('today');
      specialGrid.appendChild(div2);
    }
    return;
  }

  specialGrid.style.display = 'none';
  gridTable.style.display = '';
  title.textContent = y + "년 " + monthNames[idx];

  gridTable.innerHTML = '';
  const thead = document.createElement('tr');
  weekdayNames.forEach(d=>{
    const th = document.createElement('th'); th.textContent = d; thead.appendChild(th);
  });
  gridTable.appendChild(thead);

  let dayNum = 1;
  for(let week=0; week<4; week++){
    const tr = document.createElement('tr');
    for(let d=0; d<7; d++){
      const td = document.createElement('td');
      td.className = 'day';
      const overallIndex = idx*28 + dayNum;
      const g = new Date(base);
      g.setDate(g.getDate() + (overallIndex - 1));
      td.innerHTML = dayNum + '<span class="g">' + fmt(g) + '</span>';
      if(sameDay(g, todayReal)) td.classList.add('today');
      tr.appendChild(td);
      dayNum++;
    }
    gridTable.appendChild(tr);
  }
}

function sameDay(a,b){
  return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
}

function step(delta){
  let y = parseInt(yearSel.value);
  let idx = monthSel.value === 'special' ? 13 : parseInt(monthSel.value) - 1;
  idx += delta;
  if(idx > 13){ idx = 0; y += 1; }
  if(idx < 0){ idx = 13; y -= 1; }
  yearSel.value = y;
  monthSel.value = idx === 13 ? 'special' : String(idx + 1);
  render();
}

document.getElementById('prevBtn').addEventListener('click', ()=>step(-1));
document.getElementById('nextBtn').addEventListener('click', ()=>step(1));
yearSel.addEventListener('input', render);
monthSel.addEventListener('change', render);
render();

</script>
</body>
</html>
